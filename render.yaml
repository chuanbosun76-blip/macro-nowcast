services:
  - type: web
    name: macro-nowcast
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ACCESS_PASSWORD
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-pro
      - key: DATA_DIR
        value: /tmp/nowcast-data
