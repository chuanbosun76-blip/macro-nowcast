services:
  - type: web
    name: macro-nowcast
    runtime: docker
    region: singapore
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ACCESS_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /data
    disk:
      name: nowcast-data
      mountPath: /data
      sizeGB: 1
